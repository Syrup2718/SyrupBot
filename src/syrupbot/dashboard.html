<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyrupBot 後台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍯</text></svg>">
<style>
  :root {
    --bg: #f5f3ef; --panel: #ffffff; --panel-2: #faf8f5; --ink: #1d1b18; --muted: #77716a;
    --faint: #a8a199; --line: #e6e1da; --accent: #d4742a; --accent-soft: #fbeadb;
    --ok: #2e8a57; --ok-soft: #e2f3e9; --bad: #c0443a; --bad-soft: #fbe5e2;
    --info: #3767b8; --info-soft: #e3ecfa; --bot: #7a5cc2; --bot-soft: #eee8fa;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 2px 8px rgb(0 0 0 / 0.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311; --panel: #1d1c19; --panel-2: #23211e; --ink: #ece7e0; --muted: #a09990;
      --faint: #6e6861; --line: #322f2b; --accent: #f0a15c; --accent-soft: #3b2a1b;
      --ok: #62c48d; --ok-soft: #1c3226; --bad: #ef7b6f; --bad-soft: #3a1f1c;
      --info: #82a9ee; --info-soft: #1d2838; --bot: #b49cf0; --bot-soft: #2a2340;
      --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; }
  button, input { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* ── 頂部 ── */
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft);
    display: grid; place-items: center; font-size: 18px; }
  .brand h1 { margin: 0; font-size: 16px; line-height: 1.2; }
  .brand small { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .live .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .down .dot { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .down { color: var(--bad); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 12px;
    cursor: pointer; }
  .btn:hover { border-color: var(--faint); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ── 數字卡 ── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
    padding: 14px 20px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
    box-shadow: var(--shadow); min-width: 0; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 20px; font-weight: 650; line-height: 1.3; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .stat .s { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── 主要版面 ── */
  .layout { flex: 1; min-height: 0; display: grid; gap: 14px; padding: 14px 20px 18px;
    grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1fr); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .card-h h2 { margin: 0; font-size: 14px; }
  .card-h .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1; }
  .empty { color: var(--muted); padding: 28px 16px; text-align: center; }

  /* 頻道清單 */
  .chan { display: block; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
    padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .chan:hover { background: var(--panel-2); }
  .chan.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .chan .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chan .guild { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chan .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }

  /* 頻道狀態 */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--line); }
  .badge.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .badge.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
  .badge.warn { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

  /* 對話 */
  .chat { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .m { display: flex; gap: 8px; align-items: flex-start; max-width: 92%; }
  .m.self { align-self: flex-end; flex-direction: row-reverse; }
  .av { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #fff; }
  .m .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; display: flex; gap: 6px; align-items: center; }
  .m.self .who { justify-content: flex-end; }
  .tag-bot { font-size: 10px; font-weight: 700; color: var(--bot); background: var(--bot-soft); border-radius: 4px; padding: 0 5px; }
  .bubble { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; border-top-left-radius: 4px;
    padding: 6px 10px; white-space: pre-wrap; word-break: break-word; }
  .m.self .bubble { background: var(--accent-soft); border-color: transparent; border-radius: 12px; border-top-right-radius: 4px; }
  .m.bot .bubble { background: var(--bot-soft); border-color: transparent; }

  /* 事件 */
  .tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px;
    cursor: pointer; font-size: 13px; }
  .chip .c { color: var(--faint); margin-left: 4px; }
  .chip.sel { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .chip.sel .c { color: inherit; }
  .search { flex: 1 1 140px; min-width: 120px; border: 1px solid var(--line); background: var(--panel-2);
    border-radius: 8px; padding: 3px 10px; }
  .search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .check { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  .ev { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 4px 10px; padding: 9px 14px;
    border-bottom: 1px solid var(--line); }
  .ev time { color: var(--faint); font-size: 12px; padding-top: 2px; }
  .ev .head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .kind { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 7px; }
  .k-human { color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); }
  .k-bot_seen { color: var(--bot); background: var(--bot-soft); }
  .k-bot_ignored { color: var(--bad); background: var(--bad-soft); }
  .k-decision-yes { color: var(--ok); background: var(--ok-soft); }
  .k-decision-no { color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); }
  .k-reply, .k-lull { color: var(--accent); background: var(--accent-soft); }
  .ev .author { font-weight: 600; }
  .ev .where { color: var(--faint); font-size: 12px; }
  .ev .text { grid-column: 2; white-space: pre-wrap; word-break: break-word; display: -webkit-box;
    -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .ev .detail { grid-column: 2; color: var(--muted); font-size: 13px; }
  .ev.bot_ignored .detail { color: var(--bad); }
  .ev.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }

  /* 設定 */
  .settings { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; padding: 12px 14px; }
  .settings dt { color: var(--muted); }
  .settings dd { margin: 0; font-variant-numeric: tabular-nums; }
  .settings h3 { grid-column: 1 / -1; margin: 10px 0 0; font-size: 12px; color: var(--faint); font-weight: 600;
    letter-spacing: 0.05em; }
  .settings h3:first-child { margin-top: 0; }
  .note { color: var(--faint); font-size: 12px; padding: 0 14px 14px; }

  .tabs { display: flex; gap: 4px; }
  .tab { border: 0; background: transparent; padding: 2px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tab.sel { background: var(--panel-2); color: var(--ink); }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .channels-card { grid-column: 1 / -1; }
    .channels-card .scroll { display: flex; overflow-x: auto; }
    .channels-card .chan { min-width: 190px; border-bottom: 0; border-right: 1px solid var(--line); }
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 12px; }
    .stats { padding: 12px 12px 0; }
    .top { padding: 10px 12px; }
    .card { max-height: 70vh; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">🍯</div>
    <div>
      <h1 id="title">SyrupBot 後台</h1>
      <small id="subtitle">連線中…</small>
    </div>
  </div>
  <span class="spacer"></span>
  <span class="pill" id="status"><span class="dot"></span><span id="status-text">連線中</span></span>
  <button class="btn" id="pause" title="暫停自動更新">暫停</button>
</header>

<section class="stats" id="stats"></section>

<main class="layout">
  <section class="card channels-card">
    <div class="card-h"><h2>頻道</h2><span class="sub" id="chan-count"></span></div>
    <div class="scroll" id="channels"></div>
  </section>

  <section class="card">
    <div class="card-h"><h2>她看到的對話</h2><span class="sub" id="chat-title"></span></div>
    <div class="badges" id="badges" hidden></div>
    <div class="scroll" id="chat-scroll"><div class="chat" id="chat"></div></div>
  </section>

  <section class="card">
    <div class="card-h">
      <div class="tabs">
        <button class="tab sel" data-tab="events">最近事件</button>
        <button class="tab" data-tab="settings">目前設定</button>
      </div>
    </div>
    <div id="pane-events" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="tools">
        <span id="filters" style="display:contents"></span>
        <input class="search" id="search" type="search" placeholder="搜尋名字或內容">
        <label class="check"><input type="checkbox" id="only-chan"> 只看此頻道</label>
      </div>
      <div class="scroll" id="events"></div>
    </div>
    <div id="pane-settings" class="scroll" hidden></div>
  </section>
</main>

<script>
const KIND = {
  human: "成員", bot_seen: "bot 已記", bot_ignored: "bot 略過",
  decision: "判斷", reply: "回覆", lull: "冷場接話",
};
const FILTERS = [
  ["all", "全部", null],
  ["bots", "別的 bot", ["bot_seen", "bot_ignored"]],
  ["decide", "判斷", ["decision"]],
  ["replies", "她的回覆", ["reply", "lull"]],
];
const STRATEGY = { heuristic: "機率規則", llm: "LLM 判斷", hybrid: "混合" };
const BOT_MODE = { off: "只看不回", mention: "被 @ 才回", all: "跟成員一樣" };
const QUOTE_MODE = { off: "從不", auto: "看情況", always: "每次" };
const PALETTE = ["#d4742a", "#3767b8", "#2e8a57", "#a5508f", "#b8862b", "#4e8f9c", "#7a5cc2", "#c0443a"];

const token = new URLSearchParams(location.search).get("token");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let state = null, fetchedAt = 0, selected = null, filter = "all", tab = "events";
let paused = false, lastTopEvent = null;

function hue(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 5) return "剛剛";
  if (s < 60) return `${Math.floor(s)} 秒前`;
  if (s < 3600) return `${Math.floor(s / 60)} 分鐘前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小時前`;
  return new Date(t * 1000).toLocaleDateString("zh-TW");
}
function duration(s) {
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d} 天 ${h} 小時`;
  if (h) return `${h} 小時 ${m} 分`;
  if (m) return `${m} 分 ${s % 60} 秒`;
  return `${s} 秒`;
}
function seconds(v) {
  if (v >= 3600 && v % 3600 === 0) return `${v / 3600} 小時`;
  if (v >= 60 && v % 60 === 0) return `${v / 60} 分鐘`;
  return `${v} 秒`;
}
const pct = (v) => `${Math.round(v * 100)}%`;
function channelName(id) {
  const full = state?.channel_names?.[id];
  if (!full) return { name: `#${id.slice(-6)}`, guild: "未知頻道" };
  const i = full.lastIndexOf("/");
  return i < 0 ? { name: `#${full}`, guild: "" } : { name: `#${full.slice(i + 1)}`, guild: full.slice(0, i) };
}
function lastActivity(id) {
  const e = state.events.find((x) => x.channel_id === id);
  return e ? e.at : null;
}

function renderStats() {
  const c = state.counts || {}, d = state.decisions || {reply: 0, skip: 0};
  const total = d.reply + d.skip;
  const uptime = Date.now() / 1000 - state.started_at;
  const cards = [
    ["角色", esc(state.persona), `${STRATEGY[state.strategy] || state.strategy} · ${esc(state.model)}`],
    ["已運行", duration(uptime), `模型請求進行中 ${state.in_flight}`],
    ["成員訊息", (c.human || 0).toLocaleString(), "啟動以來"],
    ["回覆率", total ? pct(d.reply / total) : "—", `判斷 ${total} 次,要回 ${d.reply} 次`],
    ["她說了", (c.reply || 0).toLocaleString(), `冷場接話 ${c.lull || 0} 次`],
    ["別的 bot", `${c.bot_seen || 0} / ${c.bot_ignored || 0}`, "已記 / 略過"],
  ];
  $("stats").innerHTML = cards.map(([k, v, s]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`).join("");
}

function renderChannels() {
  const chans = [...state.channels].sort((a, b) => (lastActivity(b.id) || 0) - (lastActivity(a.id) || 0));
  $("chan-count").textContent = chans.length ? `${chans.length} 個` : "";
  if (!chans.length) {
    $("channels").innerHTML = `<div class="empty">還沒有頻道。<br>有人在頻道講話後就會出現。</div>`;
    return;
  }
  if (!chans.some((c) => c.id === selected)) selected = chans[0].id;
  $("channels").innerHTML = chans.map((c) => {
    const { name, guild } = channelName(c.id);
    const last = lastActivity(c.id);
    const fatigue = Math.min(1, c.fatigue / 3);
    return `<button class="chan ${c.id === selected ? "sel" : ""}" data-id="${c.id}">
      <div class="name">${esc(name)}</div>
      <div class="guild">${esc(guild)}${last ? " · " + ago(last) : ""}</div>
      <div class="row" title="話量疲勞 ${c.fatigue}"><span>疲勞</span><span class="bar"><i style="width:${pct(fatigue)}"></i></span>
        <span class="num">${c.context_count}/${c.context_limit}</span></div>
    </button>`;
  }).join("");
}

function cooldownLeft(c) {
  return Math.max(0, c.cooldown_left - (Date.now() - fetchedAt) / 1000);
}

function renderBadges() {
  const c = state.channels.find((x) => x.id === selected);
  if (!c) { $("badges").hidden = true; return; }
  const cd = cooldownLeft(c);
  const items = [
    c.allowed ? `<span class="badge ok">可以互動</span>` : `<span class="badge bad">不在白名單</span>`,
    cd > 0 ? `<span class="badge warn num">冷卻中 · 剩 ${Math.ceil(cd)} 秒</span>` : `<span class="badge">不在冷卻</span>`,
    `<span class="badge num">話量疲勞 ${c.fatigue}</span>`,
    `<span class="badge num">上下文 ${c.context_count} / ${c.context_limit} 則</span>`,
  ];
  $("badges").innerHTML = items.join("");
  $("badges").hidden = false;
}

function renderChat() {
  const box = $("chat-scroll");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const c = state.channels.find((x) => x.id === selected);
  $("chat-title").textContent = c ? channelName(c.id).name : "";
  renderBadges();
  if (!c) { $("chat").innerHTML = `<div class="empty">選一個頻道來看她記得的對話。</div>`; return; }
  $("chat").innerHTML = c.messages.map((m) => {
    const cls = m.is_self ? "self" : m.is_bot ? "bot" : "";
    const initial = esc([...String(m.author)][0] || "?");
    return `<div class="m ${cls}">
      <div class="av" style="background:${m.is_self ? "var(--accent)" : hue(m.author)}">${initial}</div>
      <div><div class="who">${esc(m.author)}${m.is_bot ? `<span class="tag-bot">BOT</span>` : ""}</div>
      <div class="bubble">${esc(m.content)}</div></div>
    </div>`;
  }).join("") || `<div class="empty">這個頻道的上下文是空的。</div>`;
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

function eventKindClass(e) {
  if (e.kind !== "decision") return `k-${e.kind}`;
  return e.detail.startsWith("要回") ? "k-decision-yes" : "k-decision-no";
}
function eventLabel(e) {
  if (e.kind !== "decision") return KIND[e.kind] || e.kind;
  return e.detail.startsWith("要回") ? "要回" : "不回";
}
function eventDetail(e) {
  return e.kind === "decision" ? e.detail.replace(/^(要回|不回):/, "") : e.detail;
}

function renderEvents() {
  const q = $("search").value.trim().toLowerCase();
  const onlyChan = $("only-chan").checked;
  const base = state.events.filter((e) => !onlyChan || e.channel_id === selected);
  $("filters").innerHTML = FILTERS.map(([key, name, kinds]) => {
    const n = kinds ? base.filter((e) => kinds.includes(e.kind)).length : base.length;
    return `<button class="chip ${key === filter ? "sel" : ""}" data-filter="${key}">${name}<span class="c num">${n}</span></button>`;
  }).join("");
  const kinds = FILTERS.find(([key]) => key === filter)[2];
  const rows = base.filter((e) => (!kinds || kinds.includes(e.kind)) &&
    (!q || `${e.author} ${e.text} ${e.detail}`.toLowerCase().includes(q)));
  const box = $("events"), keep = box.scrollTop;
  const newest = state.events[0] ? `${state.events[0].at}|${state.events[0].text}` : null;
  const fresh = lastTopEvent !== null && newest !== lastTopEvent;
  lastTopEvent = newest;
  box.innerHTML = rows.map((e, i) => `
    <div class="ev ${e.kind} ${fresh && i === 0 ? "flash" : ""}">
      <time class="num" title="${new Date(e.at * 1000).toLocaleString("zh-TW", {hour12: false})}" data-at="${e.at}">${ago(e.at)}</time>
      <div class="head">
        <span class="kind ${eventKindClass(e)}">${eventLabel(e)}</span>
        ${e.author ? `<span class="author">${esc(e.author)}</span>` : ""}
        ${onlyChan ? "" : `<span class="where">${esc(channelName(e.channel_id).name)}</span>`}
      </div>
      ${e.text ? `<div class="text">${esc(e.text)}</div>` : ""}
      ${eventDetail(e) ? `<div class="detail">${esc(eventDetail(e))}</div>` : ""}
    </div>`).join("") || `<div class="empty">${q || filter !== "all" || onlyChan ? "沒有符合條件的事件。" : "還沒有事件。"}</div>`;
  box.scrollTop = keep;
}

function renderSettings() {
  const s = state.settings || {};
  const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
  const strategy = s.decision_strategy;
  $("pane-settings").innerHTML = `<dl class="settings">
    <h3>回覆判斷</h3>
    ${row("策略", STRATEGY[strategy] || strategy)}
    ${strategy === "hybrid" ? row("交給模型判斷的機率", pct(s.look_probability)) : row("基礎插話機率", pct(s.reply_probability))}
    ${row("回覆冷卻", seconds(s.reply_cooldown_seconds))}
    ${strategy !== "heuristic" ? row("模型判斷冷卻", seconds(s.decision_cooldown_seconds)) : ""}
    ${row("話量疲勞半衰期", s.talk_fatigue_half_life_seconds ? seconds(s.talk_fatigue_half_life_seconds) : "關閉")}
    ${row("冷場接話機率", s.lull_probability ? pct(s.lull_probability) : "關閉")}
    <h3>別的 bot</h3>
    ${row("回覆方式", BOT_MODE[s.bot_reply_mode] || s.bot_reply_mode)}
    ${s.bot_reply_mode !== "off" ? row("連鎖上限", `${seconds(s.bot_reply_window_seconds)}內最多 ${s.bot_reply_max} 次`) : ""}
    <h3>回覆方式</h3>
    ${row("引用回覆", QUOTE_MODE[s.reply_quote_mode] || s.reply_quote_mode)}
    ${s.reply_quote_mode === "auto" ? row("沒人插話時也引用", pct(s.reply_quote_probability)) : ""}
    ${row("tag 成員", state.tag_members ? "開啟" : "關閉")}
    <h3>模型</h3>
    ${row("回覆模型", esc(state.model))}
    ${row("判斷模型", esc(state.decision_model || state.model))}
  </dl><div class="note">這裡只能看。要調整請改 .env 後重啟 bot。</div>`;
}

function render() {
  $("title").textContent = `${state.persona} 的後台`;
  document.title = `${state.persona} · SyrupBot 後台`;
  renderStats();
  renderChannels();
  renderChat();
  renderEvents();
  if (tab === "settings") renderSettings();
}

function setStatus(ok, text) {
  $("status").className = "pill " + (ok ? "live" : "down");
  $("status-text").textContent = text;
}

async function refresh() {
  if (paused) return;
  try {
    const res = await fetch("api/state" + (token ? `?token=${encodeURIComponent(token)}` : ""));
    if (!res.ok) throw new Error(res.status === 401 ? "token 不正確" : `HTTP ${res.status}`);
    state = await res.json();
    fetchedAt = Date.now();
    render();
    setStatus(true, "即時更新");
    $("subtitle").textContent = "更新於 " + new Date().toLocaleTimeString("zh-TW", {hour12: false});
  } catch (err) {
    setStatus(false, "連不上 bot");
    $("subtitle").textContent = err.message === "Failed to fetch" ? "bot 可能沒在執行" : err.message;
  }
}

// 每秒更新相對時間與冷卻倒數,不必重抓資料。
function tick() {
  if (!state) return;
  document.querySelectorAll("time[data-at]").forEach((el) => { el.textContent = ago(Number(el.dataset.at)); });
  renderBadges();
}

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button");
  if (!t || !state && !t.id) return;
  if (t.dataset.id) {
    selected = t.dataset.id;
    renderChannels();
    $("chat-scroll").scrollTop = 1e9;
    renderChat();
    renderEvents();
  } else if (t.dataset.filter) {
    filter = t.dataset.filter; renderEvents();
  } else if (t.dataset.tab) {
    tab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("sel", x === t));
    $("pane-events").style.display = tab === "events" ? "flex" : "none";
    $("pane-settings").hidden = tab !== "settings";
    if (tab === "settings" && state) renderSettings();
  } else if (t.id === "pause") {
    paused = !paused;
    t.textContent = paused ? "繼續" : "暫停";
    t.classList.toggle("on", paused);
    if (paused) setStatus(true, "已暫停");
    else refresh();
  }
});
$("search").addEventListener("input", () => state && renderEvents());
$("only-chan").addEventListener("change", () => state && renderEvents());

refresh();
setInterval(refresh, 3000);
setInterval(tick, 1000);
</script>
</body>
</html>
